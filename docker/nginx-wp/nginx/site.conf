# A typical WordPress server block on nginx + PHP-FPM, as most VPS guides
# write it. Edit and reload to try what a client would change:
#   docker compose exec web nginx -s reload

server {
    listen 8090;
    server_name site.localhost;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # After "Move WordPress into /wp": WordPress's own addresses under /wp/
    # (pretty links, the REST API) go to /wp/index.php, not the root's.
    location /wp/ {
        try_files $uri $uri/ /wp/index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}

# A second address for the "folder beside WordPress" layout: a static site at
# its own (sub)domain, served from /var/www/static.
server {
    listen 8090;
    server_name static.localhost;
    root /var/www/static;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
